<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Picture This!</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="header">
    <div class="title">
      <h1>Picture This!</h1>
      <h4>My Really Cool Blog Post</h4>
    </div>
    <picture>
      <source srcset="images/museum-800x800.jpg 800w, images/museum-1600x1600.jpg 1600w" media="(min-width:1600px)" sizes="50vw">
      <source srcset="images/museum-640x640.jpg 640w, images/museum-1280x1280.jpg 1280w" media="(min-width:1280px)" sizes="50vw">
      <source srcset="images/museum-480x480.jpg 480w, images/museum-960x960.jpg 960w" media="(min-width:960px)" sizes="50vw">
      <source srcset="images/museum-720x.jpg 720w" media="(min-width:720px)" sizes="100vw">
      <source srcset="images/museum-480x.jpg 480w" media="(min-width:480px)" sizes="100vw">
      <source srcset="images/museum-320x.jpg 320w" media="(max-width:320px)" sizes="100vw">
      <img src="images/museum.jpg" alt="placeholder">
    </picture>
  </header>
</body>

</html>
