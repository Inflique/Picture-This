<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Picture This!</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="header">
    <div class="title">
      <h1>Picture This!</h1>
      <h4>My Really Cool Blog Post</h4>
    </div>
    <picture>
      <source srcset="images/museum-1600x1600.jpg" media="(min-width:1600px)">
      <source srcset="images/museum-1200x1200.jpg" media="(min-width:1200px)">
      <source srcset="images/museum-960x960.jpg" media="(min-width:960px)">
      <source srcset="images/museum-720x.jpg" media="(min-width:720px)">
      <source srcset="images/museum-480x.jpg" media="(min-width:480px)">
      <source srcset="images/museum-320x.jpg" media="(max-width:320px)">
      <img src="images/museum.jpg" alt="placeholder">
    </picture>
  </header>
</body>

</html>
